# Database Configuration
# H2 in-memory database configuration for demonstration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration (for testing and viewing data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
# Show SQL queries in console for learning purposes
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Logging Configuration
# Enable debug logging for Spring Data JPA
logging.level.org.springframework.data.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
server.port=8080

# HATEOAS Configuration
# Enable HATEOAS type=hal+json format
spring.hateoas.use-hal-as-default-json-media-type=true