# Spring Boot Application Configuration for Docker Demo
# This file contains application-specific settings

# Application Information
# These properties can be injected into Java classes using @Value annotation
app.name=Docker Spring Boot Demo
app.version=1.0.0

# Server Configuration
# Port where the embedded Tomcat server will listen
# In Docker, this port will be exposed and can be mapped to host ports
server.port=8080

# Logging Configuration
# Set log levels for different packages
# This is especially useful when debugging issues in Docker containers
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO

# Console logging pattern (visible in Docker logs)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration (Health Checks and Monitoring)
# Actuator endpoints are crucial for containerized applications
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# Custom application info (visible at /actuator/info)
info.app.name=${app.name}
info.app.version=${app.version}
info.app.description=A simple Spring Boot application demonstrating Docker containerization
info.docker.tips=Use Docker commands to manage this containerized application

# Health check configuration
# These settings help Docker and orchestrators determine if the container is healthy
management.health.defaults.enabled=true

# Graceful shutdown (important for Docker containers)
# Allows the application to finish processing requests before shutting down
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s