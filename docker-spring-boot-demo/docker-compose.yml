# Docker Compose Configuration
# 
# Docker Compose is a tool for defining and running multi-container Docker applications.
# It uses a YAML file to configure application services, networks, and volumes.
# 
# Benefits of using Docker Compose:
# 1. Easy multi-container orchestration
# 2. Environment-specific configurations
# 3. Simplified networking between containers
# 4. Volume management
# 5. Service scaling

version: '3.8'  # Docker Compose file format version

# =============================================================================
# SERVICES DEFINITION
# =============================================================================
services:
  
  # Main Spring Boot application service
  app:
    # Service name - this will be the hostname for inter-container communication
    container_name: spring-boot-docker-demo
    
    # Build configuration
    build:
      context: .              # Build context (current directory)
      dockerfile: Dockerfile  # Dockerfile to use (default name)
    
    # Alternative: Use pre-built image
    # image: spring-boot-docker-demo:latest
    
    # Port mapping: host_port:container_port
    # Maps port 8080 on your machine to port 8080 in the container
    ports:
      - "8080:8080"
    
    # Environment variables
    # These override values in application.properties
    environment:
      - SPRING_PROFILES_ACTIVE=docker  # Activate Docker-specific profile
      - app.name=Spring Boot Docker Compose Demo
      - app.version=1.0.0-compose
    
    # Health check configuration
    # Docker Compose will monitor the application health
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s    # Check every 30 seconds
      timeout: 10s     # Timeout after 10 seconds
      retries: 5       # Retry 5 times before marking as unhealthy
      start_period: 60s # Wait 60 seconds before starting health checks
    
    # Restart policy
    # always: Always restart if container stops
    # unless-stopped: Restart unless explicitly stopped
    # on-failure: Restart only if container exits with error
    restart: unless-stopped
    
    # Resource limits (optional but recommended for production)
    deploy:
      resources:
        limits:
          memory: 512M    # Maximum memory usage
          cpus: '0.5'     # Maximum CPU usage (50% of one CPU core)
        reservations:
          memory: 256M    # Reserved memory
          cpus: '0.25'    # Reserved CPU
    
    # Volumes for persistent data (if needed)
    volumes:
      # Example: Mount logs directory to host
      - ./logs:/app/logs
      # Example: Mount configuration from host
      # - ./config:/app/config:ro  # :ro means read-only
    
    # Networks (if you need custom networking)
    networks:
      - app-network
    
    # Dependencies (if this service depends on other services)
    # depends_on:
    #   - database
    #   - redis

  # =============================================================================
  # ADDITIONAL SERVICES (Examples for learning)
  # =============================================================================
  
  # Example: PostgreSQL database (commented out - uncomment if needed)
  # database:
  #   image: postgres:15-alpine
  #   container_name: postgres-db
  #   environment:
  #     POSTGRES_DB: springbootdb
  #     POSTGRES_USER: dbuser
  #     POSTGRES_PASSWORD: dbpass
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - app-network
  #   restart: unless-stopped

  # Example: Redis cache (commented out - uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis-cache
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - app-network
  #   restart: unless-stopped

  # Example: Nginx reverse proxy (commented out - uncomment if needed)
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx-proxy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - app-network
  #   restart: unless-stopped

# =============================================================================
# NETWORKS DEFINITION
# =============================================================================
networks:
  app-network:
    driver: bridge  # Default network driver
    # Custom network allows containers to communicate using service names
    # Example: app can connect to database using hostname "database"

# =============================================================================
# VOLUMES DEFINITION
# =============================================================================
volumes:
  # Create a logs directory on the host
  logs:
    driver: local
  
  # Example volumes for other services (commented out)
  # postgres_data:
  #   driver: local
  # redis_data:
  #   driver: local

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
# 
# Start all services:
# docker-compose up
# 
# Start in background (detached mode):
# docker-compose up -d
# 
# Build and start:
# docker-compose up --build
# 
# Stop all services:
# docker-compose down
# 
# Stop and remove volumes:
# docker-compose down -v
# 
# View logs:
# docker-compose logs app
# 
# Follow logs in real-time:
# docker-compose logs -f app
# 
# Scale a service (run multiple instances):
# docker-compose up --scale app=3
# 
# Execute command in running container:
# docker-compose exec app sh
# 
# View service status:
# docker-compose ps
# 
# Rebuild a specific service:
# docker-compose build app